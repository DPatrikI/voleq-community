name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build-macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate changed whitespace
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          PUSH_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PULL_REQUEST_BASE_SHA...HEAD"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          elif [[ "$PUSH_REF_TYPE" == "branch" \
            && "$PUSH_REF_NAME" != "$DEFAULT_BRANCH" ]] \
            && git cat-file -e "origin/${DEFAULT_BRANCH}^{commit}" 2>/dev/null; then
            git diff --check "origin/${DEFAULT_BRANCH}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Verify toolchain
        run: ./dev doctor

      - name: Run tests
        run: ./dev test

      - name: Build strict release
        run: swift build -c release --product VolEqCommunityMac -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build Community app
        run: ./dev build macos
